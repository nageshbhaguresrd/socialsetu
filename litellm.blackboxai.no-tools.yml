# ============================================================================
# LiteLLM Configuration: NO TOOL CALLING, NO STREAMING - Production Safe
# ============================================================================
# This configuration completely disables all tool/function calling and streaming,
# and enforces plain chat completions only. It is designed to prevent:
# - "Invalid parameter: messages with role 'tool' must be a response to a preceding message with 'tool_calls'"
# - "stream_initialization_failed" errors
#
# Compatible with:
# - OpenRouter API
# - Vercel AI Gateway
# - Custom models (custom/blackbox-base)
# - VSCode AI extensions (Cline, Cursor, Blackbox)
# - Next.js server-side APIs
#
# Key features:
# - All tool/function calling disabled globally
# - Streaming DISABLED globally
# - Safe fallback chain with free OpenRouter models
# - No agent mode
# - No recursive fallback loops
# - Request transformation to strip invalid fields
# - 45 second timeout
# - Max 2 retries
# ============================================================================

# ---- Environment Variables Required ----
# OPENROUTER_API_KEY: Your OpenRouter API key
# OPENAI_API_KEY: (Optional) For OpenAI fallback
# OPENAI_API_BASE: (Optional) Custom OpenAI endpoint

# ============================================================================
# Global Defaults: DROP ALL TOOL/FUNCTION PARAMS AND DISABLE STREAMING
# ============================================================================
drop_params:
  # These parameters will be automatically removed from all requests
  - functions
  - function_call
  - tools
  - tool_choice
  - tool_calls
  - parallel_tool_calls
  - response_format  # May cause issues with some providers
  - n                # Multiple completions not needed
  - stream             # Force disable streaming

# ============================================================================
# Model List: Primary and Fallback Models (NON-STREAMING)
# ============================================================================
model_list:
  # --------------------------------------------------------------------------
  # Primary: OpenRouter Free Gemma Model
  # --------------------------------------------------------------------------
  # Using Gemma as primary - most stable free model
  - model_name: openrouter/google/gemma-2-9b-it:free
    litellm_params:
      model: openrouter/google/gemma-2-9b-it:free
      api_base: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      api_type: openai
    model_info:
      id: openrouter/google/gemma-2-9b-it:free
      mode: chat
      # Force non-streaming
      stream: false

  # --------------------------------------------------------------------------
  # Fallback 1: OpenRouter Free Llama Model
  # --------------------------------------------------------------------------
  - model_name: openrouter/meta-llama/llama-3.1-8b-instruct:free
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct:free
      api_base: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      api_type: openai
    model_info:
      id: openrouter/meta-llama/llama-3.1-8b-instruct:free
      mode: chat
      stream: false

  # --------------------------------------------------------------------------
  # Fallback 2: OpenRouter Free Mistral Model
  # --------------------------------------------------------------------------
  - model_name: openrouter/mistralai/mistral-7b-instruct:free
    litellm_params:
      model: openrouter/mistralai/mistral-7b-instruct:free
      api_base: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      api_type: openai
    model_info:
      id: openrouter/mistralai/mistral-7b-instruct:free
      mode: chat
      stream: false

  # --------------------------------------------------------------------------
  # Optional: Custom Blackbox Base (if you have a specific endpoint)
  # --------------------------------------------------------------------------
  # Note: Only use this if you have a verified non-tool-calling endpoint
  - model_name: custom/blackbox-base
    litellm_params:
      model: custom/blackbox-base
      api_base: ${OPENAI_API_BASE:-https://api.blackbox.ai/v1}
      api_key: ${OPENAI_API_KEY:-dummy}
      api_type: openai
    model_info:
      id: custom/blackbox-base
      mode: chat
      stream: false

# ============================================================================
# Settings: HARD DISABLE ALL TOOL/AGENT FEATURES AND STREAMING
# ============================================================================
settings:
  # Completely disable function/tool support at the adapter level
  supports_functions: false
  supports_tools: false
  supports_parallel_tool_calls: false
  
  # DISABLE STREAMING GLOBALLY
  stream: false
  
  # Disable agent mode to prevent automatic tool injection
  agent_mode: false
  
  # Disable content policy fallback which may inject tool messages
  content_policy_fallback: false
  
  # Ensure standard chat completion behavior
  mode: chat
  # Force non-streaming completion
  stream_timeout: 0

# ============================================================================
# Fallback Chain: Prevent Recursive Loops (NON-STREAMING)
# ============================================================================
# This defines the fallback order when a model fails.
# IMPORTANT: This is a LINEAR chain, not recursive.
# Once a fallback succeeds, no further fallbacks are attempted.
fallbacks:
  # Primary -> Fallback 1 -> Fallback 2
  - openrouter/google/gemma-2-9b-it:free:
    - openrouter/meta-llama/llama-3.1-8b-instruct:free:
      - openrouter/mistralai/mistral-7b-instruct:free

# ============================================================================
# Routing Rules: Map model names to our safe models
# ============================================================================
routing:
  # Route any request for custom/blackbox-base to our safe OpenRouter primary
  - model_name: custom/blackbox-base
    target: openrouter/google/gemma-2-9b-it:free
  # Route any streaming requests or unstable models to non-streaming models
  - model_name: kwaipilot/kat-coder-pro
    target: openrouter/google/gemma-2-9b-it:free

# ============================================================================
# Request Transformation: Strip Invalid Fields BEFORE Sending
# ============================================================================
# This ensures that even if the client sends invalid data, it gets cleaned up.
request_transform:
  # Remove these keys from the request
  remove_keys:
    - functions
    - function_call
    - tools
    - tool_choice
    - tool_calls
    - parallel_tool_calls
    - response_format
    - n
    - stream

# ============================================================================
# Retry Configuration: Safe retry without inheriting invalid state
# ============================================================================
retry:
  # Number of retries per model before moving to fallback
  num_retries: 2
  
  # Exponential backoff
  exponential_backoff: true
  
  # Don't retry on these errors (they indicate fundamental issues)
  retry_on_errors:
    - "RateLimitError"
    - "TimeoutError"
    - "ConnectionError"
  
  # Do NOT retry on these (indicates invalid request or streaming issues)
  do_not_retry_on_errors:
    - "InvalidRequestError"
    - "AuthenticationError"
    - "BadRequestError"
    - "stream_initialization_failed"
    - "StreamError"

# ============================================================================
# Provider-Specific Overrides
# ============================================================================
provider_config:
  openrouter:
    # OpenRouter-specific settings
    supports_functions: false
    supports_tools: false
    # FORCE DISABLE STREAMING
    stream: false
    drop_params:
      - tools
      - tool_choice
      - functions
      - function_call
      - response_format
      - stream

# ============================================================================
# Logging: Debug Configuration
# ============================================================================
# Enable detailed logging for troubleshooting
# Set via environment variable: LITELLM_LOG=DEBUG
litellm_settings:
  # Log all requests and responses (useful for debugging tool injection)
  success_callback: []
  failure_callback: []
  
  # Track which model was used and if fallback occurred
  track_usage: true
  
  # Log streaming status
  log_streaming_disabled: true
  
  # Log selected model
  log_selected_model: true